  h2 {
    margin: 0 0 0.7em;
    font-size: 1.08rem;
    line-height: 1.35;
  }

  ul {
    margin: 0;
    padding-left: 1.2em;
  }

  li + li {
    margin-top: 0.35em;
  }

  a {
    color: var(--accent);
    text-decoration: none;
  }

  a:hover {
