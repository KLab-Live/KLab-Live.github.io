<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bode Lab 탭별 수식 설명 자료</title>
  <meta name="description" content="Bode Lab 앱의 단일 루프와 캐스케이드 탭에서 사용하는 제어 수식과 지표 계산식을 정리한 설명 자료">
  <meta property="og:title" content="Bode Lab 탭별 수식 설명 자료">
  <meta property="og:description" content="전류 루프, 속도 캐스케이드, 보상 ON/OFF, Bode 지표 수식 정리">
  <meta property="og:type" content="article">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --paper: #ffffff;
      --ink: #1d2330;
      --muted: #657085;
      --line: #dce2ec;
      --accent: #0b66d8;
      --accent-soft: #e8f1ff;
      --code: #f3f5f8;
      --shadow: 0 20px 55px rgba(23, 35, 58, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(232, 241, 255, 0.9) 0, rgba(247, 248, 251, 0) 360px),
        var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      line-height: 1.72;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .site-header {
      max-width: 1180px;
      margin: 0 auto;
      padding: 36px 24px 20px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.6rem);
      line-height: 1.14;
      letter-spacing: 0;
    }

    .lede {
      max-width: 760px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .toolbar a {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--ink);
      font-size: 0.92rem;
      font-weight: 650;
      text-decoration: none;
    }

    .toolbar a.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 260px) minmax(0, 1fr);
      gap: 24px;
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 24px 48px;
      align-items: start;
    }

    nav {
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 32px);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 8px 30px rgba(23, 35, 58, 0.08);
      backdrop-filter: blur(10px);
    }

    nav h2 {
      margin: 0;
      padding: 14px 16px 8px;
      font-size: 0.88rem;
      color: var(--muted);
    }

    nav ol {
      margin: 0;
      padding: 0 0 10px;
      list-style: none;
    }

    nav a {
      display: block;
      padding: 7px 16px;
      color: var(--ink);
      font-size: 0.9rem;
      line-height: 1.38;
      text-decoration: none;
    }

    nav a:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    main {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    article {
      max-width: 870px;
      margin: 0 auto;
      padding: 38px 48px 56px;
    }

    article > h1:first-child {
      display: none;
    }

    h2 {
      margin: 2.1em 0 0.7em;
      padding-top: 0.35em;
      border-top: 1px solid var(--line);
      font-size: 1.55rem;
      line-height: 1.3;
      letter-spacing: 0;
    }

    h3 {
      margin: 1.7em 0 0.55em;
      font-size: 1.15rem;
      line-height: 1.35;
      letter-spacing: 0;
    }

    p {
      margin: 0.85em 0;
    }

    a {
      color: var(--accent);
    }

    table {
      display: block;
      width: 100%;
      margin: 1.1em 0;
      border-collapse: collapse;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    th,
    td {
      padding: 9px 12px;
      border: 1px solid var(--line);
      vertical-align: top;
      min-width: 110px;
    }

    th {
      background: #f3f6fb;
      font-weight: 700;
      white-space: nowrap;
    }

    code {
      padding: 0.1em 0.32em;
      border-radius: 4px;
      background: var(--code);
      color: #233047;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
    }

    pre {
      overflow-x: auto;
      padding: 14px 16px;
      border-radius: 8px;
      background: #101827;
      color: #edf3ff;
    }

    pre code {
      padding: 0;
      background: transparent;
      color: inherit;
    }

    blockquote {
      margin: 1.2em 0;
      padding: 0.2em 1em;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      color: #24324a;
    }

    .status {
      padding: 28px;
      color: var(--muted);
    }

    .MathJax_Display,
    mjx-container[display="true"] {
      overflow-x: auto;
      overflow-y: hidden;
      max-width: 100%;
      padding: 0.2em 0;
    }

    @media (max-width: 900px) {
      .layout {
        display: block;
        padding: 10px 14px 32px;
      }

      nav {
        position: static;
        max-height: 260px;
        margin-bottom: 14px;
      }

      article {
        padding: 26px 20px 40px;
      }

      .site-header {
        padding: 28px 18px 12px;
      }
    }

    @media print {
      body {
        background: white;
      }

      .site-header,
      nav {
        display: none;
      }

      .layout,
      main,
      article {
        display: block;
        max-width: none;
        margin: 0;
        padding: 0;
        border: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <p class="eyebrow">Bode Lab Reference</p>
    <h1>탭별 수식 설명 자료</h1>
    <p class="lede">단일 전류 루프와 전류-속도 캐스케이드 탭에서 쓰는 PI 제어기, 플랜트, 지연, 센서 필터, 보상 OFF, 안정성·응답성 지표 수식을 한곳에 정리했습니다.</p>
    <div class="toolbar">
      <a class="primary" href="./Bode_Lab_탭별_수식_설명자료.md">Markdown 원문</a>
      <a href="https://github.com/KLab-Live/Bode_Lab">Bode Lab 저장소</a>
    </div>
  </header>

  <div class="layout">
    <nav aria-label="문서 목차">
      <h2>목차</h2>
      <ol id="toc">
        <li><a href="#content">문서를 불러오는 중</a></li>
      </ol>
    </nav>

    <main>
      <article id="content">
        <p class="status">Markdown 문서를 불러오는 중입니다.</p>
      </article>
    </main>
  </div>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.3/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  <script>
    const markdownPath = './Bode_Lab_탭별_수식_설명자료.md';
    const content = document.getElementById('content');
    const toc = document.getElementById('toc');

    function slugify(text) {
      return text
        .trim()
        .toLowerCase()
        .replace(/<[^>]*>/g, '')
        .replace(/[^\p{L}\p{N}]+/gu, '-')
        .replace(/^-+|-+$/g, '') || 'section';
    }

    function buildToc() {
      const headings = [...content.querySelectorAll('h2')];
      toc.innerHTML = '';
      const used = new Map();

      headings.forEach((heading) => {
        const base = slugify(heading.textContent);
        const count = used.get(base) || 0;
        used.set(base, count + 1);
        heading.id = count ? `${base}-${count + 1}` : base;

        const item = document.createElement('li');
        const link = document.createElement('a');
        link.href = `#${heading.id}`;
        link.textContent = heading.textContent;
        item.appendChild(link);
        toc.appendChild(item);
      });
    }

    async function render() {
      try {
        marked.setOptions({
          gfm: true,
          breaks: false,
          headerIds: false,
          mangle: false
        });

        const response = await fetch(markdownPath);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const markdown = await response.text();
        const html = marked.parse(markdown);
        content.innerHTML = DOMPurify.sanitize(html, {
          ADD_TAGS: ['mjx-container'],
          ADD_ATTR: ['jax', 'display']
        });

        buildToc();

        if (window.MathJax?.typesetPromise) {
          await window.MathJax.typesetPromise([content, toc]);
        }
      } catch (error) {
        content.innerHTML = `<p class="status">문서를 불러오지 못했습니다. 같은 폴더에 Markdown 파일이 있는지 확인하세요.<br>${error.message}</p>`;
      }
    }

    render();
  </script>
</body>
</html>
